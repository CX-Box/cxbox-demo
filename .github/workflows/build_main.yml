name: Build project

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17','21']
    steps:
      - name: Checkout last state of main
        uses: actions/checkout@v4
        with:
          ref: 'main'
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: "maven"
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: "yarn"
          cache-dependency-path: ui
      - name: Java version
        run: java -version
      - name: Maven version
        run: mvn -v
      - name: Node version
        run: node -v
      - name: Npm version
        run: npm -v
      - name: Yarn version
        run: yarn -v
      - name: Yarn version /usr/local/bin/
        run: /usr/local/bin/yarn -v
      - name: Build with Maven
        run: mvn clean install -U -PUI -Pcoverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sonar
        if: matrix.java == '21'
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar
          -Dsonar.organization=cx-box
          -Dsonar.projectKey=CX-Box_cxbox-demo
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.login=$SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Login to Docker Hub
        if: matrix.java == '17'
        uses: docker/login-action@49ed152c8eca782a232dede0303416e8f356c37b
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cxbox-demo:latest
      - name: prepare - stop all containers from previous deploy
        if: matrix.java == '17'
        uses: appleboy/ssh-action@25ce8cbbcb08177468c7ff7ec5cbfa236f9341e1
        with:
          host: 188.124.37.74
          username: ${{ secrets.CXBOX_DEMO_SSH_USER }}
          password: ${{ secrets.CXBOX_DEMO_SSH_PASSWORD }}
          port: 22
          script: |
            sudo mkdir /home/cxbox/demo || true
            sudo chmod -R 777 /home/cxbox/demo || true
            cd /home/cxbox/demo
            sudo docker ps
            sudo docker compose -f docker-compose-prod.yml rm -svfa || true
            sudo docker system prune --force
            sudo docker volume prune --force
            sudo docker image prune -a --force
            sudo docker ps
      - name: prepare - copy files from new release and delete old files
        if: matrix.java == '17'
        uses: appleboy/scp-action@8a92fcdb1eb4ffbf538b2fa286739760aac8a95b
        with:
          host: 188.124.37.74
          username:  ${{ secrets.CXBOX_DEMO_SSH_USER }}
          password: ${{ secrets.CXBOX_DEMO_SSH_PASSWORD }}
          port: 22
          source: "docker,docker-compose-prod.yml"
          target: /home/cxbox/demo
          rm: true
      - name: prepare - add docker env varialbes populated from secrets
        if: matrix.java == '17'
        uses: appleboy/ssh-action@25ce8cbbcb08177468c7ff7ec5cbfa236f9341e1
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          host: 188.124.37.74
          username: ${{ secrets.CXBOX_DEMO_SSH_USER }}
          password: ${{ secrets.CXBOX_DEMO_SSH_PASSWORD }}
          port: 22
          envs: MAIL_PASSWORD
          script: |
            sudo mkdir /home/cxbox/demo || true
            sudo chmod -R 777 /home/cxbox/demo || true
            cd /home/cxbox/demo
            echo "MAIL_PASSWORD=$MAIL_PASSWORD" > '.env'
      - name: start
        if: matrix.java == '17'
        uses: appleboy/ssh-action@25ce8cbbcb08177468c7ff7ec5cbfa236f9341e1
        with:
          host: 188.124.37.74
          username: ${{ secrets.CXBOX_DEMO_SSH_USER }}
          password: ${{ secrets.CXBOX_DEMO_SSH_PASSWORD }}
          port: 22
          script: |
            sudo chmod -R 777 /home/cxbox/demo || true
            cd /home/cxbox/demo
            sudo docker compose -f docker-compose-prod.yml up -d --wait -t 60
            docker ps